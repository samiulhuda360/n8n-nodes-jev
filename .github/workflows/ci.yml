name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # Replays the recorded Jev and chat-model answers; CI never calls a live API.
      - run: node eval/run.mjs --offline
      - name: Recorded results are up to date
        run: git diff --exit-code eval/results.md
